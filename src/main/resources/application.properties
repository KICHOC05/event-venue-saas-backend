spring.application.name=demo

# Local development only. Both locations are optional so packaged deployments
# can rely exclusively on environment variables or a secret manager.
spring.config.import=optional:file:./.env.local[.properties],optional:file:./backend/.env.local[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Server
server.port=${SERVER_PORT:8080}
# Keep NONE unless the application is behind a trusted proxy that sanitizes forwarded headers.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:NONE}

# MariaDB connection. Credentials are required and have no insecure fallback.
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&useSSL=${DB_USE_SSL:true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}

# JPA/Hibernate. Production defaults to schema validation.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT. APP_JWT_SECRET must contain at least 32 random bytes.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

# Login rate limiting. This first implementation is local to each backend instance.
app.login-rate-limit.max-attempts=${APP_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
app.login-rate-limit.window-seconds=${APP_LOGIN_RATE_LIMIT_WINDOW_SECONDS:900}
app.login-rate-limit.block-seconds=${APP_LOGIN_RATE_LIMIT_BLOCK_SECONDS:900}

# Cloudinary. Keep the private API secret on the backend only.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Multipart upload limits
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:2MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:2MB}
