# Staging keeps application-side SQL and bind-parameter logs disabled. Slow-query
# capture is configured in MariaDB itself; see ops/mariadb/staging-slow-query.cnf.example.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
